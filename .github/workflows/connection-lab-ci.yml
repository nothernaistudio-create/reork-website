name: Connection Lab Input Validation

on:
  pull_request:
    paths:
      - 'connection-lab.html'
      - 'tests/connection-lab.test.js'
      - '.github/workflows/connection-lab-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate actual Connection Lab application
        run: node --test tests/connection-lab.test.js
